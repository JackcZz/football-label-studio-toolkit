<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帧检助手 · 独立查看窗</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1a2233; background: #101828; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #101828; color: #fff; }
  #bar .t { font-weight: 700; white-space: nowrap; }
  #bar .fi { font-size: 12px; color: #aeb9cf; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button { background: #25324a; color: #fff; border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  #bar button:hover { background: #32456a; }
  #bar button.primary { background: #2456c8; }
  #bar button.primary:hover { background: #1a45a8; }
  #bar input { width: 80px; font-size: 12px; padding: 3px 8px; border: 0; border-radius: 6px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; background: #0b1220; overflow: hidden; }
  #cv { position: absolute; inset: 0; }
  #side { flex: none; width: 330px; background: #fff; overflow-y: auto; padding: 10px 12px; }
  #side h3 { font-size: 13px; margin: 10px 0 6px; color: #2a3550; }
  #side .meta { font-size: 12px; color: #5b6478; margin-bottom: 8px; }
  .sg { display: flex; align-items: flex-start; gap: 8px; border: 1px solid #e4e8f0; border-left-width: 4px; border-radius: 8px; padding: 7px 9px; margin: 6px 0; font-size: 12px; cursor: pointer; }
  .sg:hover { background: #f7f9fc; }
  .sg .txt { flex: 1; min-width: 0; }
  .sg .why { color: #5b6478; font-size: 11px; margin-top: 2px; }
  .sg .cf { font-size: 10px; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .sg button { font-size: 11px; padding: 2px 9px; border-radius: 6px; border: 0; background: #2456c8; color: #fff; cursor: pointer; white-space: nowrap; }
  .sg button.done { background: #0e8a5f; cursor: default; }
  .ok { color: #0e8a5f; }
  .legend { font-size: 11px; color: #5b6478; margin-top: 10px; border-top: 1px dashed #e4e8f0; padding-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0e8a5f; color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 8px; z-index: 99; display: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8fa0bd; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="t">帧检助手 · 查看窗</span>
    <span class="fi" id="fi">载入中…</span>
    <button id="btn-prev">◀ 上一帧</button>
    <button id="btn-next">下一帧 ▶</button>
    <input id="jump" type="text" inputmode="numeric" placeholder="帧号" />
    <button id="btn-jump">跳转</button>
    <button id="btn-zoom-in">＋</button>
    <button id="btn-zoom-out">－</button>
    <button id="btn-fit">适应</button>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="loading">图片载入中…</div>
    </div>
    <div id="side">
      <h3>当前帧</h3>
      <div class="meta" id="meta">—</div>
      <h3>AI 修正建议（前后 <span id="win-n">5</span> 帧证据）</h3>
      <div id="sug-list">—</div>
      <div class="legend">
        <div><i style="background:#2456c8"></i>teamA　<i style="background:#c8102e"></i>teamB　<i style="background:#0e8a5f"></i>门将　<i style="background:#d99a06"></i>裁判</div>
        <div>虚线半透明框 = AI 建议（补号绿 / 改号橙 / 补框紫 / 删框红）</div>
        <div>滚轮缩放（以鼠标为中心）· 拖拽平移 · 点建议定位并放大</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="api.js"></script>
<script src="viewer.js"></script>
</body>
</html>
